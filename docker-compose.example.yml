version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: edunode-mysql
    restart: always
    environment:
      MYSQL_DATABASE: edunode_db
      MYSQL_USER: <YOUR_DB_USER>
      MYSQL_PASSWORD: <YOUR_DB_PASSWORD>
      MYSQL_ROOT_PASSWORD: <YOUR_ROOT_PASSWORD>
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    image: <YOUR_DOCKER_USERNAME>/edunode-backend:latest
    container_name: edunode-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/edunode_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=<YOUR_DB_USER>
      - SPRING_DATASOURCE_PASSWORD=<YOUR_DB_PASSWORD>
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

volumes:
  mysql_data:
